# Curated WASI P1 catalog. Never auto-mirror nixpkgs.
# version = package version (upstream or Wawona-owned). NOT the ABI.
# origin = port | scratch
#   port: version MUST match upstream release; name is upstream name;
#         homepage MUST be the upstream project URL
#   scratch: Wawona-written smoke; distinct name; homepage = that tool's page
# See docs/package-versioning.md and repo.wawona.io rule repo-wawona-io-ports


[meta]
maintainers = ["aspauldingcode"]
max_new_per_nightly = 8

# --- Active: Wawona-original Runtime smokes (not ports of GNU/jq/…) ---

[[packages]]
name = "hello-wasi"
version = "0.1.2"
abi = "wasi-p1"
status = "active"
origin = "scratch"
build = "cargo-wasip1"
version_policy = "local"
source = "packages/hello-wasi"
bin = "hello-wasi"
homepage = "https://github.com/Wawona/wasm-packages/tree/development/packages/hello-wasi"
summary = "Wawona WASI P1 hello smoke for wpm"
smoke_args = []
smoke_expect = "hello"

[[packages]]
name = "wasi-true"
version = "0.1.0"
abi = "wasi-p1"
status = "active"
