name: Build wasm packages

on:
  schedule:
    # Daily UTC: freshness vs catalog + upstream sources, then build stale set.
    - cron: "0 6 * * *"
  push:
    branches: [development, main]
    paths:
      - "packages/**"
      - "allowlist.toml"
      - "recipes.json"
      - "scripts/**"
      - ".github/workflows/build-wasm.yml"
  pull_request:
    branches: [development, main]
  workflow_dispatch:
    inputs:
      packages:
        description: "Comma-separated package names, all, or nightly"
        required: false
        default: "all"

permissions:
  contents: write
  actions: read

concurrency:
  group: build-wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    name: Freshness + matrix
    runs-on: ubuntu-24.04
    outputs:
      packages: ${{ steps.set.outputs.packages }}
      bumped: ${{ steps.bump.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync check
        run: python3 scripts/sync-recipes-from-allowlist.py --check

      - name: Rust (for cargo update bumps)
        if: github.event_name == 'schedule' || github.event.inputs.packages == 'nightly'
        uses: dtolnay/rust-toolchain@stable

      - name: Check upstream + bump outdated
        id: bump
        run: |
          mkdir -p out
          python3 scripts/check-upstream-versions.py --out out/upstream-report.json
          BUMPED=0
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event.inputs.packages }}" == "nightly" ]]; then
            before="$(git status --porcelain)"
            python3 scripts/bump-outdated.py out/upstream-report.json
            after="$(git status --porcelain)"
            if [[ "$after" != "$before" ]]; then
              BUMPED=1
            fi
          fi
          echo "bumped=$BUMPED" >> "$GITHUB_OUTPUT"
          python3 -c 'import json; r=json.load(open("out/upstream-report.json")); print("outdated", r.get("outdated_names")); print("bumps", r.get("bump_names"))'

      - id: set
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event.inputs.packages }}" == "nightly" ]]; then
            MODE=nightly
          else
            MODE='${{ github.event.inputs.packages || 'all' }}'
          fi
          # nightly select reuses out/upstream-report.json when present
          echo "packages=$(python3 scripts/select-build-packages.py "$MODE")" >> "$GITHUB_OUTPUT"

      - name: Upload freshness report
        uses: actions/upload-artifact@v4
        with:
          name: upstream-report
          path: out/upstream-report.json
          if-no-files-found: error

      - name: Upload bumped sources
        if: steps.bump.outputs.bumped == '1'
        uses: actions/upload-artifact@v4
        with:
          name: bumped-sources
          path: |
            allowlist.toml
            recipes.json
            packages/
          if-no-files-found: error

  build:
    name: Build ${{ matrix.package }}
    needs: freshness
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.freshness.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4

      - name: Overlay bumped sources
        if: needs.freshness.outputs.bumped == '1'
        uses: actions/download-artifact@v4
        with:
          name: bumped-sources
          path: .

      - name: Rust wasm32-wasip1
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Install wasmtime
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "v25.0.2"

      - name: Build
        run: |
          chmod +x scripts/*.sh
          ./scripts/build-package.sh "${{ matrix.package }}"

      - name: Smoke (Wasmtime P1/P2)
        run: ./scripts/smoke-package.sh "${{ matrix.package }}"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-${{ matrix.package }}
          path: out/${{ matrix.package }}/
          if-no-files-found: error

  combine:
    name: Combine wasm-out + smoke summary
    needs: build
    runs-on: ubuntu-24.04
    if: always() && needs.build.result != 'cancelled'
    steps:
      - uses: actions/checkout@v4
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/arts
          pattern: wasm-*
          merge-multiple: false
      - name: Stage combined tree
        run: |
          mkdir -p out
          for d in /tmp/arts/wasm-*; do
            name="${d##*/wasm-}"
            mkdir -p "out/$name"
            cp -a "$d"/. "out/$name/"
          done
          find out -type f
          python3 scripts/summarize-smoke-results.py
      - name: Upload wasm-out
        uses: actions/upload-artifact@v4
        with:
          name: wasm-out
          path: out/
          if-no-files-found: error


  commit-bumps:
    name: Commit version bumps
    needs: [freshness, combine]
    if: needs.freshness.outputs.bumped == '1' && needs.combine.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Overlay bumped sources
        uses: actions/download-artifact@v4
        with:
          name: bumped-sources
          path: .
      - name: Commit
        run: |
          git config user.name "wawona-wasm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add allowlist.toml recipes.json packages
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "wasm: bump outdated sources from runner freshness check [skip ci]"
          git pull --rebase --ff-only origin "${{ github.ref_name }}" || true
          git push origin "HEAD:${{ github.ref_name }}"

  summary:
    name: All packages green (Wasmtime smokes)
    needs: [freshness, build, combine]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Check build + Wasmtime smoke result
        run: |
          if [[ "${{ needs.freshness.result }}" != "success" ]]; then
            echo "freshness failed"
            exit 1
          fi
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "one or more package build/Wasmtime smoke jobs failed"
            exit 1
          fi
          if [[ "${{ needs.combine.result }}" != "success" ]]; then
            echo "combine or smoke-summary failed"
            exit 1
          fi
          echo "all matrix builds + Wasmtime smokes succeeded"
