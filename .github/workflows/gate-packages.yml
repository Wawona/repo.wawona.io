name: "Gate: packages"

on:
  push:
    branches: [ development, main, master ]
  pull_request:
    branches: [ development, main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maintainers:
    name: wasm + deb maintainers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Query GitHub and check packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check-packages.py
